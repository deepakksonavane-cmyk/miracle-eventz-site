function rng(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}

function curvePts(cv,n,spread,seed){var R=rng(seed),a=[];for(var i=0;i<n;i++){var p=cv.getPoint(R());a.push(new THREE.Vector3(p.x+(R()-0.5)*spread,p.y+(R()-0.5)*spread,p.z+(R()-0.5)*spread));}return a;}

function hang(x,y,z,dx,dz,sag,cols,n,seed){var p0=new THREE.Vector3(x,y,z),p1=new THREE.Vector3(x+dx,y,z+dz),m=new THREE.Vector3(x+dx/2,y-sag,z+dz/2);var cv=new THREE.QuadraticBezierCurve3(p0,m,p1);stem(cv,0.015);bloom(curvePts(cv,n,0.2,seed),cols,0.13,seed);}
function archShape(R,legH,t){var s=new THREE.Shape();s.moveTo(-R,0);s.lineTo(-R,legH);s.absarc(0,legH,R,Math.PI,0,true);s.lineTo(R,0);s.lineTo(R-t,0);s.lineTo(R-t,legH);s.absarc(0,legH,R-t,0,Math.PI,false);s.lineTo(-R+t,0);s.closePath();return s;}

if(t>=18){playing=false;view='stage';goalP.set(0,2.3,-9);goalT.set(0,3.8,-26);moving=true;captionUpdate();}
}
else if(moving){
var lk=(DINE||PROD||GUEST)?Math.min(1,1-Math.pow(0.06,dt)):0.06;camera.position.lerp(goalP,lk);controls.target.lerp(goalT,lk);
if(camera.position.distanceTo(goalP)<0.05&&controls.target.distanceTo(goalT)<0.05)moving=false;
}
applyTod();
if(DINE||GUEST)dineTick(dt);if(MEM)memTick(dt);
if(PROD){prodTick(dt);if(dinePend&&camera.position.distanceTo(goalP)<1.2){var _v=dinePend;dinePend=null;setView(_v);}}
controls.update();
renderer.render(scene,camera);
requestAnimationFrame(frame);
}

ledCanvas=document.createElement('canvas');ledCanvas.width=1536;ledCanvas.height=768;ledCtx=ledCanvas.getContext('2d');
ledTex=new THREE.CanvasTexture(ledCanvas);ledTex.encoding=THREE.sRGBEncoding;

document.querySelectorAll('.dir').forEach(function(b){b.addEventListener('click',function(){
var keepView=view==='couple'?'entrance':view;
buildDirection(b.getAttribute('data-dir'));setView(keepView);
});});
document.querySelectorAll('.view').forEach(function(b){b.addEventListener('click',function(){setView(b.getAttribute('data-view'));});});
document.querySelectorAll('.lay').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-lay');LAY[k]=!LAY[k];applyLayers();b.classList.toggle('on',LAY[k]);});});
document.getElementById('play').addEventListener('click',startEntry);
document.getElementById('tod').addEventListener('input',function(e){todT=e.target.value/100;applyTod();});

window.addEventListener('message',function(e){
  if(e.origin!==location.origin&&e.origin!=='null')return;
  var m=e.data;if(!m||m.src!=='soneri-home')return;
  if(m.type==='dir'&&PAL[m.d]){buildDirection(m.d);setView(view==='couple'?'entrance':view);}
  else if(m.type==='view'&&VIEWS[m.v]){if(DINE||PROD||GUEST)dineGo(m.v);else setView(m.v);}
  else if(m.type==='mood'&&PROD){setMood(m.m);}
  else if(m.type==='beams'&&PROD){PX.on=!!m.on;setMood(PX.mood);}
  else if(m.type==='layer'&&Object.prototype.hasOwnProperty.call(LAY,m.k)){LAY[m.k]=!!m.on;applyLayers();document.querySelectorAll('.lay').forEach(function(b){if(b.getAttribute('data-lay')===m.k)b.classList.toggle('on',!!m.on);});}
  else if(m.type==='tod'&&typeof m.t==='number'){todT=Math.max(0,Math.min(1,m.t));document.getElementById('tod').value=Math.round(todT*100);applyTod();}
  else if(m.type==='entry'){startEntry();}
  else if(m.type==='explore'&&window.setExplore){window.setExplore(!!m.on);}
  else if(m.type==='hello'){captionUpdate();window._lastSky=null;}
  else if(m.type==='loc'&&OPS){var li=+m.i;opsSel(li,true);dineGo(li>=0?'ops'+OLOC[li].n:'oAll');}
  else if(m.type==='cam'&&MEM){var ci=+m.i;memSel(ci,true);if(ci>=0)dineGo((m.mode==='pos'?'cp':'c')+MCDEF[ci].n);}
  else if(m.type==='pav'&&DINE){focusPav(+m.i,!!m.close);if(+m.i<0)pavFocus=-1;}
  else if(m.type==='seq'&&SEQ){
    if(m.cmd==='play'){if(seqT>=SEQ_TOTAL-0.01)seqT=0;seqPlay=true;}
    else if(m.cmd==='pause'){seqPlay=false;}
    else if(m.cmd==='seek'){seqT=Math.max(0,Math.min(SEQ_TOTAL,+m.t||0));seqPlay=!!m.play;}
    seqLastPost=0;
  }
});
if(document.documentElement.classList.contains('embed')){
  controls.enabled=false;
  var ex=document.getElementById('explore');
  window.setExplore=function(on){controls.enabled=on;
    document.documentElement.classList.toggle('live',on);
    ex.textContent=on?'Done exploring':'Explore in 3D';
    canvas.style.touchAction=on?'none':'auto';
    toParent({type:'explore',on:on});};
  ex.addEventListener('click',function(){window.setExplore(!controls.enabled);});
  canvas.style.touchAction='auto';
}
if(MEM){var mdn=null;canvas.addEventListener('pointerdown',function(e){mdn=[e.clientX,e.clientY];});canvas.addEventListener('pointerup',function(e){if(!mdn)return;var d=Math.abs(e.clientX-mdn[0])+Math.abs(e.clientY-mdn[1]);mdn=null;if(d>8)return;var oi=opsPick(e);if(oi>=0){opsSel(oi);dineGo('ops'+OLOC[oi].n);return;}var i=memPick(e);if(i>=0){memSel(i);}});
 canvas.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;canvas.style.cursor=(opsPick(e)>=0||memPick(e)>=0)?'pointer':'';});}
buildDirection('A');
setView('overview');
loadEl.textContent='';
frame();
})();
