<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Phone-size preview · The Golden Bloom</title>
<style>body{margin:0;background:#2B1420;display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:20px;font:14px system-ui;color:#FFE7A0}
.ph{display:flex;flex-direction:column;gap:10px;align-items:center}
.sw{display:flex;gap:8px}.sw button{font:600 13px system-ui;padding:8px 14px;border-radius:999px;border:1.5px solid #E9BE5C;background:none;color:#FFE7A0;cursor:pointer}
.sw button[aria-pressed=true]{background:#E9BE5C;color:#2B1420}
iframe{width:390px;height:844px;border:0;border-radius:28px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.5)}</style></head>
<body><div class="ph"><span>Phone preview · 390 × 844</span>
<div class="sw"><button data-h="venue" aria-pressed="true">The venue</button><button data-h="entry" aria-pressed="false">The couple's entry</button><button data-h="food" aria-pressed="false">Food</button><button data-h="prod" aria-pressed="false">Production</button><button data-h="guest" aria-pressed="false">Guests</button><button data-h="mem" aria-pressed="false">Memories</button><button data-h="open" aria-pressed="false">Opening</button></div>
<iframe id="f" src="index.html?motion=off#venue" title="Phone-size preview"></iframe></div>
<script>document.querySelectorAll('[data-h]').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('[data-h]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});document.getElementById('f').src='index.html?motion=off&v='+Date.now()+'#'+b.getAttribute('data-h');});});</script>
</body></html>
