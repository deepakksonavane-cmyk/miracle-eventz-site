<style>
/* ============ TOKENS ============ */
:root{
  --red:#E31C23;
  --red-deep:#B8121A;
  --cream:#FFF8F0;
  --ink:#1A1512;
  --gold:#D4A017;
  --blush:#F5DDD9;
  --mauve:#8C6B68;

  --bg:var(--cream);
  --bg-raised:#FFFFFF;
  --bg-sunken:var(--blush);
  --text:var(--ink);
  --text-muted:var(--mauve);
  --accent:var(--red);
  --accent-deep:var(--red-deep);
  --accent-ink:#FFFFFF;
  --gold-accent:var(--gold);
  --border:rgba(26,21,18,0.12);
  --border-strong:rgba(26,21,18,0.22);
  --shadow:0 12px 32px rgba(26,21,18,0.10);
  --ribbon-a:var(--red);
  --ribbon-b:var(--red-deep);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1210;
    --bg-raised:#241815;
    --bg-sunken:#2C1D19;
    --text:#F6ECE6;
    --text-muted:#C9A9A0;
    --accent:#FF4B4F;
    --accent-deep:#E31C23;
    --accent-ink:#1B1210;
    --gold-accent:#E8B84B;
    --border:rgba(246,236,230,0.14);
    --border-strong:rgba(246,236,230,0.24);
    --shadow:0 16px 40px rgba(0,0,0,0.45);
    --ribbon-a:#FF4B4F;
    --ribbon-b:#B8121A;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1210;
  --bg-raised:#241815;
  --bg-sunken:#2C1D19;
  --text:#F6ECE6;
  --text-muted:#C9A9A0;
  --accent:#FF4B4F;
  --accent-deep:#E31C23;
  --accent-ink:#1B1210;
  --gold-accent:#E8B84B;
  --border:rgba(246,236,230,0.14);
  --border-strong:rgba(246,236,230,0.24);
  --shadow:0 16px 40px rgba(0,0,0,0.45);
  --ribbon-a:#FF4B4F;
  --ribbon-b:#B8121A;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important;}
}

h1,h2,h3,h4{
  font-family:"Archivo",sans-serif;
  font-weight:800;
  margin:0;
  text-wrap:balance;
  letter-spacing:-0.01em;
}
p{margin:0;}
a{color:inherit;}
.script{
  font-family:"Pacifico",cursive;
  font-weight:400;
  line-height:1;
}
.mono{
  font-family:"IBM Plex Mono",monospace;
  letter-spacing:0.02em;
}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
}

button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--gold-accent); outline-offset:2px;}

/* ============ LAYOUT SHELL ============ */
.page-wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
@media (max-width:640px){.page-wrap{padding:0 18px;}}

/* Ribbon divider — Coca-Cola-esque dynamic wave, purely CSS/SVG, no external assets */
.ribbon{
  width:100%;
  height:64px;
  display:block;
  margin-top:-1px;
}
.ribbon path{fill:var(--ribbon-a);}
.ribbon.flip{transform:scaleY(-1);}

/* ============ HEADER / NAV ============ */
header.site{
  position:sticky; top:0; z-index:50;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1180px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{
  display:flex;align-items:baseline;gap:8px;
  background:none;border:none;padding:0;
}
.brand .script{font-size:1.85rem;color:var(--accent);}
.brand .tag{font-size:0.62rem;font-family:"IBM Plex Mono",monospace;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-muted);}
nav.links{display:flex;gap:4px;align-items:center;}
nav.links button{
  background:none;border:none;color:var(--text);
  font-size:0.92rem;font-weight:600;padding:9px 14px;border-radius:100px;
  transition:background .15s, color .15s;
}
nav.links button:hover{background:var(--bg-sunken);}
nav.links button.active{background:var(--accent);color:var(--accent-ink);}
.cta-pill{
  background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:100px;padding:10px 20px;
  font-weight:700;font-size:0.9rem;white-space:nowrap;
  box-shadow:var(--shadow);
  transition:transform .15s, background .15s;
}
.cta-pill:hover{background:var(--accent-deep); transform:translateY(-1px);}
.nav-toggle{display:none;background:none;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;}
@media (max-width:860px){
  nav.links{display:none;}
  .nav-toggle{display:inline-flex;}
  .nav-inner{flex-wrap:wrap;}
}
nav.links.mobile-open{
  display:flex;flex-direction:column;width:100%;align-items:stretch;
}
nav.links.mobile-open button{text-align:left;}

/* ============ HERO ============ */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--accent) 0%, var(--accent-deep) 62%);
  color:#fff;
  padding:88px 0 0;
  overflow:hidden;
}
.hero-inner{
  max-width:1180px;margin:0 auto;padding:0 28px 76px;
  display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;
}
@media (max-width:900px){.hero-inner{grid-template-columns:1fr;}}
.hero h1{
  font-size:clamp(2.6rem,5.4vw,4.4rem);
  color:#fff;
  line-height:1.03;
}
.hero h1 .script{
  display:block;color:var(--gold-accent);
  font-size:clamp(2.8rem,6vw,4.8rem);
  margin-top:6px;
}
.hero .lede{
  margin-top:22px;font-size:1.15rem;max-width:46ch;color:rgba(255,255,255,0.92);
}
.hero .hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
.btn-gold{
  background:var(--gold-accent);color:#2B1B06;border:none;border-radius:100px;
  padding:15px 26px;font-weight:800;font-size:1rem;
  box-shadow:0 10px 24px rgba(0,0,0,0.25);
  transition:transform .15s;
}
.btn-gold:hover{transform:translateY(-2px);}
.btn-ghost{
  background:transparent;color:#fff;border:2px solid rgba(255,255,255,0.55);
  border-radius:100px;padding:13px 24px;font-weight:700;font-size:1rem;
  transition:border-color .15s, background .15s;
}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,0.08);}

/* hero medallion — CSS-drawn celebratory motif, no external image */
.medallion{
  position:relative;width:100%;aspect-ratio:1/1;max-width:360px;margin:0 auto;overflow:hidden;
}
.star-field{position:absolute;inset:0;}
.falling-star{position:absolute;top:-8%;color:#fff;line-height:1;animation-name:starFall;animation-timing-function:linear;animation-iteration-count:infinite;}
@keyframes starFall{
  0%{top:-8%;opacity:0;}
  8%{opacity:1;}
  92%{opacity:1;}
  100%{top:108%;opacity:0;}
}
@media (prefers-reduced-motion: reduce){
  .falling-star{animation:none;opacity:0.7;}
}
.hero-stats{
  display:flex;gap:28px;margin-top:38px;flex-wrap:wrap;
}
.hero-stats div{min-width:110px;}
.hero-stats .num{font-family:"Archivo";font-weight:900;font-size:1.9rem;color:var(--gold-accent);}
.hero-stats .lbl{font-size:0.78rem;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:0.08em;}

/* ============ SECTIONS ============ */
section{padding:76px 0;}
.section-head{max-width:640px;margin-bottom:44px;}
.section-head h2{font-size:clamp(1.8rem,3.4vw,2.6rem);margin-top:10px;}
.section-head p{margin-top:14px;color:var(--text-muted);font-size:1.05rem;}

/* Services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.svc-grid{grid-template-columns:1fr;}}
.svc-card{
  background:var(--bg-raised);border:1px solid var(--border);border-radius:18px;
  padding:28px 24px;transition:transform .18s, box-shadow .18s, border-color .18s;
}
.svc-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--border-strong);}
.svc-icon{width:46px;height:46px;margin-bottom:16px;}
.svc-card h3{font-size:1.18rem;margin-bottom:8px;}
.svc-card p{color:var(--text-muted);font-size:0.95rem;}
.svc-price{margin-top:14px;font-family:"IBM Plex Mono";font-size:0.85rem;color:var(--accent);font-weight:600;}

/* Portfolio */
.folio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:900px){.folio-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.folio-grid{grid-template-columns:1fr;}}
.case-gallery{
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:140px;gap:14px;
}
.case-gallery img{
  width:100%;height:100%;object-fit:cover;border-radius:14px;
  box-shadow:0 8px 20px rgba(26,21,18,0.16);
  transition:transform .25s ease, box-shadow .25s ease;
  display:block;
}
.case-gallery a{display:block;border-radius:14px;overflow:hidden;}
.case-gallery a:hover img{transform:scale(1.04);box-shadow:0 14px 30px rgba(26,21,18,0.26);}
.case-gallery .g-big{grid-column:span 2;grid-row:span 2;}
.case-gallery .g-tall{grid-row:span 2;}
.case-gallery .g-wide{grid-column:span 2;}
@media (max-width:820px){
  .case-gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:120px;}
  .case-gallery .g-big{grid-column:span 2;grid-row:span 2;}
}
@media (max-width:480px){
  .case-gallery{grid-template-columns:1fr;grid-auto-rows:200px;}
  .case-gallery .g-big, .case-gallery .g-wide, .case-gallery .g-tall{grid-column:span 1;grid-row:span 1;}
}
.case-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media (max-width:700px){.case-detail-grid{grid-template-columns:1fr;}}
.archive-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:900px){.archive-strip{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.archive-strip{grid-template-columns:1fr;}}
.folio-card{
  position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;
  display:flex;align-items:flex-end;padding:20px;color:#fff;
  isolation:isolate;
}
.folio-card::before{
  content:"";position:absolute;inset:0;z-index:-1;
}
.folio-card::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(0,0,0,0) 40%, rgba(0,0,0,0.72) 100%);
}
.folio-card h4{font-size:1.1rem;}
.folio-card span{font-size:0.78rem;opacity:0.85;font-family:"IBM Plex Mono";}
.folio-1::before{background:linear-gradient(150deg,#E31C23,#7A0E12);}
.folio-2::before{background:linear-gradient(150deg,#D4A017,#8C5E0A);}
.folio-3::before{background:linear-gradient(150deg,#8C6B68,#3D2A27);}
.folio-4::before{background:linear-gradient(150deg,#B8121A,#E31C23);}
.folio-5::before{background:linear-gradient(150deg,#3D2A27,#1A1512);}
.folio-6::before{background:linear-gradient(150deg,#E8B84B,#D4A017);}

/* Testimonials */
.testi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.testi-row{grid-template-columns:1fr;}}
.testi-card{
  background:var(--bg-sunken);border-radius:18px;padding:28px;
  display:flex;flex-direction:column;gap:16px;
}
.testi-quote{font-size:1.02rem;line-height:1.55;}
.testi-quote::before{content:"\201C";color:var(--accent);font-family:"Archivo";font-weight:900;font-size:1.4rem;}
.testi-who{display:flex;align-items:center;gap:12px;}
.testi-avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:"Archivo";font-weight:800;font-size:0.95rem;
  background:var(--accent);
}
.testi-name{font-weight:700;font-size:0.92rem;}
.testi-event{font-size:0.8rem;color:var(--text-muted);}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;}
@media (max-width:800px){.contact-grid{grid-template-columns:1fr;}}
.contact-info .row{display:flex;gap:14px;margin-bottom:20px;align-items:flex-start;}
.contact-info .row svg{flex-shrink:0;margin-top:2px;}
.contact-info h4{font-size:0.95rem;margin-bottom:2px;}
.contact-info p{color:var(--text-muted);font-size:0.92rem;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.82rem;font-weight:700;margin-bottom:6px;}
.field input, .field textarea{
  width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border-strong);
  background:var(--bg-raised);color:var(--text);font-family:inherit;font-size:0.95rem;
}
.field textarea{resize:vertical;min-height:100px;}
.field input:focus, .field textarea:focus{border-color:var(--accent);outline:none;}

/* Footer */
footer{
  background:var(--ink);color:#F6ECE6;padding:48px 0 28px;
}
footer .foot-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;align-items:center;}
footer .script{color:var(--gold-accent);font-size:1.4rem;}
footer .fine{font-size:0.82rem;color:#C9A9A0;margin-top:6px;}
footer .foot-links{display:flex;gap:20px;font-size:0.85rem;flex-wrap:wrap;}

/* ============ 7-STEP QUOTE FLOW ============ */
.quote-shell{
  max-width:760px;margin:0 auto;padding:48px 0 90px;
}
.progress-track{
  display:flex;align-items:center;gap:4px;margin-bottom:38px;
}
.progress-seg{flex:1;height:6px;border-radius:6px;background:var(--border);overflow:hidden;}
.progress-seg .fill{height:100%;width:0%;background:var(--accent);transition:width .35s ease;}
.progress-label{
  display:flex;justify-content:space-between;margin-bottom:10px;
  font-family:"IBM Plex Mono";font-size:0.78rem;color:var(--text-muted);
}
.step-card{
  background:var(--bg-raised);border:1px solid var(--border);border-radius:22px;
  padding:40px;box-shadow:var(--shadow);
}
.step-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  font-family:"Archivo";font-weight:800;font-size:0.95rem;margin-bottom:16px;
}

/* ============ V3 ADDITIONS ============ */

/* Primary CTA — brand red, high contrast on every background, never black */
.btn-primary{
  background:var(--red);color:#fff;border:none;border-radius:100px;
  padding:15px 28px;font-weight:800;font-size:0.98rem;letter-spacing:0.01em;
  box-shadow:0 10px 26px rgba(227,28,35,0.35);
  transition:transform .15s, background .15s, box-shadow .15s;
}
.btn-primary:hover{background:var(--red-deep);transform:translateY(-2px);box-shadow:0 14px 32px rgba(227,28,35,0.45);}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
.cta-pill, .float-cta{background:var(--red);color:#fff;}
.cta-pill:hover{background:var(--red-deep);}

/* Persistent floating CTA */
.float-cta{
  position:fixed; right:22px; bottom:22px; z-index:70;
  border:none; border-radius:100px;
  padding:14px 22px; font-weight:800; font-size:0.88rem;
  box-shadow:0 12px 28px rgba(0,0,0,0.35);
  display:flex; align-items:center; gap:8px;
  opacity:0; transform:translateY(16px); pointer-events:none;
  transition:opacity .3s ease, transform .3s ease, background .15s;
}
.float-cta.show{opacity:1; transform:none; pointer-events:auto;}
.float-cta:hover{background:var(--red-deep);}
@media (max-width:640px){.float-cta{right:14px;bottom:14px;padding:12px 18px;font-size:0.82rem;}}

/* Scroll reveal (restrained motion, respects reduced-motion) */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);}
.reveal.in{opacity:1;transform:none;}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1 !important;transform:none !important;transition:none !important;}}

/* WHY MIRACLE EVENTZ */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}

/* ============ ROUTER ============ */
const VALID_ROUTES = ['home','thinking','stories','services','portfolio','testimonials','contact','quote'];

function goTo(r){
  route = r;
  history.pushState(null, '', '#' + route);
  render();
  const nav = document.getElementById('navLinks');
  if(nav) nav.classList.remove('mobile-open');
  window.scrollTo({top:0, behavior:'smooth'});
}

function routeFromHash(){
  const h = (window.location.hash || '').replace(/^#/, '');
  if(!h) return 'home';
  if(VALID_ROUTES.includes(h) || h.indexOf('story-')===0 || h.indexOf('case-')===0) return h;
  return 'home';
}

window.addEventListener('popstate', function(){
  route = routeFromHash();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

function toggleMobileNav(){
  document.getElementById('navLinks').classList.toggle('mobile-open');
}

function render(){
  document.querySelectorAll('nav.links button[data-route]').forEach(b=>{
    b.classList.toggle('active', b.dataset.route===route);
  });
  const app = document.getElementById('app');
  if(route==='home') app.innerHTML = renderHome();
  else if(route==='thinking') app.innerHTML = renderThinking();
  else if(route==='services') app.innerHTML = renderServices();
  else if(route==='portfolio') app.innerHTML = renderPortfolio();
  else if(route==='testimonials') app.innerHTML = renderTestimonials();
  else if(route==='contact') app.innerHTML = renderContact();
  else if(route==='quote') app.innerHTML = renderQuote();
  else if(route==='stories') app.innerHTML = renderStories();
  else if(route.indexOf('story-')===0) app.innerHTML = renderStory(route.slice(6));
  else if(route.indexOf('case-')===0) app.innerHTML = renderCaseStudy(route.slice(5));
  if(route==='quote') renderStep();
  document.title = route==='thinking' ? 'Thinking Before the Event — Miracle Eventz'
    : route==='stories' ? 'Stories From The Field — Miracle Eventz'
    : route.indexOf('story-')===0 ? 'Stories From The Field — Miracle Eventz'
    : 'Miracle Eventz';
  wireReveals();
  const fc = document.getElementById('floatCta');
  if(fc) fc.classList.toggle('show', route!=='quote' && window.scrollY > 480);
  // GA4 pageview — this is an SPA (no real page loads), so the automatic
  // gtag pageview never fires again after the first load. We fire one
  // manually on every route change instead (config above has send_page_view:false).
  if(typeof gtag === 'function'){
    gtag('event', 'page_view', {
      page_title: document.title,
      page_path: '#' + route,
      page_location: window.location.href
    });
  }
}

    drawerListenerAttached = true;
  }

function closeServiceDrawer(){
  if(activeDrawerKey === null) return;
  const overlay = document.getElementById('svcDrawerOverlay');
  const drawer = document.getElementById('svcDrawer');
  if(!overlay || !drawer) return;
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  const fc = document.getElementById('floatCta');
  if(fc) fc.classList.remove('drawer-hidden');
  activeDrawerKey = null;
  if(drawerTriggerEl && drawerTriggerEl.isConnected && drawerTriggerEl.focus) drawerTriggerEl.focus();
  drawerTriggerEl = null;
}
function goToFromDrawer(route){

function drawerKeyHandler(ev){
  if(activeDrawerKey === null) return;
  if(ev.key === 'Escape'){ closeServiceDrawer(); return; }
  if(ev.key === 'Tab'){
    const drawer = document.getElementById('svcDrawer');
    if(!drawer) return;
    const focusable = drawer.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
    if(focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if(ev.shiftKey && document.activeElement === first){
      ev.preventDefault(); last.focus();
    } else if(!ev.shiftKey && document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
  }
}

  el.setAttribute('aria-expanded', String(!wasOpen));

function medallionSVG(){
  const STAR_COUNT = 25;
  let stars = '';
  for(let i=0;i<STAR_COUNT;i++){
    const left = (Math.random()*94+3).toFixed(1);
    const size = (Math.random()*10+9).toFixed(1);
    const dur = (Math.random()*4+3.5).toFixed(1);
    const delay = (Math.random()*8).toFixed(1);
    const opacity = (Math.random()*0.5+0.5).toFixed(2);
    stars += `<span class="falling-star" style="left:${left}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:-${delay}s;opacity:${opacity};">&#9733;</span>`;
  }
  return `<div class="star-field">${stars}</div>`;
}

function ribbonSVG(){
  return `<svg class="ribbon" viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
    <path d="M0,30 C200,60 400,0 600,25 C800,50 1000,5 1200,30 L1200,60 L0,60 Z" fill="var(--bg)"/>
  </svg>`;
}

/* ============ THINKING ============ */
function renderThinking(){
  return `
  <section class="thinking-page">
    <div class="think-hero">
      <div class="eyebrow">Thinking</div>
      <h1>Thinking Before the Event</h1>
      <p class="lede">Some notes on how we approach event planning and event management — the questions worth asking before the vendors, the venue, and the date lock themselves in.</p>
    </div>

    <div class="think-open">
      <p>Before an event becomes an event, someone has to figure out how it's actually going to work. You may already have the date, the venue, a concept, or a brief someone handed you — the hard part is turning that into something that survives contact with the real world.</p>
      <p>Maybe you have an idea and need someone to make it real. Maybe you've just been told, at work, that you're now the person responsible for the annual conference or the product launch, and you're not entirely sure where that responsibility starts and ends. Or maybe you started planning something simple — a wedding, a milestone celebration — and watched it quietly become more complicated than you expected, with more vendors, more moving parts, and more people asking you questions you don't have answers to yet.</p>
      <p>Wherever you're starting from, the thinking underneath good event planning is mostly the same. It's worth doing before you sign anything.</p>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">01</div><h2>Who Is Actually In Charge?</h2></div>
      <p>Most events involve a caterer, a decorator, a sound and lighting vendor, a venue team, sometimes a separate photography and entertainment crew — each competent at their own job, none of them responsible for how the pieces fit together. That gap is where most event-day stress actually comes from.</p>
      <p>It shows up in familiar ways: vendors blaming each other when something slips, a timeline that three different people have three different versions of, and — the question that matters most — who do you actually call if something goes wrong at 6pm the day of? If the honest answer is "several different people, depending on what broke," that's not a vendor problem, it's a structure problem. Good event management means one accountable owner holds the whole picture, coordinates every vendor against a single timeline, and is the one number you call, regardless of which piece is misbehaving.</p>
      <p class="think-caselink">One place this played out at scale: <button type="button" class="think-inline-link" onclick="goTo('case-hindustan-pencils-school-activity')">the Hindustan Pencils school programme — 475 schools, 8 cities, one governing team →</button></p>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">02</div><h2>The Hidden Cost</h2></div>
      <p>The number on the first quote and the number you actually pay are rarely the same number, and that's true across the event industry, not just with any one vendor. It's a well-worn pattern: a headline price that looks reasonable, followed by a string of line items disclosed later — security deposits, corkage or outside-vendor fees, AV markups, service charges and gratuities, taxes, rush charges for last-minute changes.</p>
      <p>None of these are necessarily unfair on their own. The problem is timing — finding out about them after you've committed, not before. The fix is asking for an all-in number up front: one document that states what's included, what's excluded, and what triggers an extra charge, before advance money changes hands.</p>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">03</div><h2>Vendor Trust</div></div>
      <p>A polished portfolio tells you what a vendor's best day looked like. It doesn't tell you how they behave on an average day, or a bad one — and that's the day you actually need to plan around.</p>
      <p>Before paying an advance to any vendor or agency, it's worth doing a few unglamorous things: asking for references you can actually call, not just quote; getting the scope of work in writing, specific enough that "included" and "not included" aren't left to memory; and asking to see real past work — a full event, ideally one you can verify with the client — rather than a highlight reel. Red flags worth taking seriously: no written contract, reluctance to share references, and pressure to pay the full amount before any of the above is settled.</p>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">04</div><h2>Sequencing &amp; Timeline</div></div>
      <p>A surprising amount of event planning stress comes from booking things in the wrong order. Venues get locked in before the guest count or format is settled. Decor gets briefed before the run-of-show exists. A date gets confirmed before checking whether the vendors you actually want are even free that week.</p>
      <p>Each of these causes rework later — a venue that doesn't fit the final numbers, a decor brief that has to be redone once the stage plan changes, a preferred vendor who's already booked. The value of a correct sequence — objective and format first, then date and venue, then the specialist vendors, then the fine detail — isn't just tidiness. It's fewer expensive do-overs in the final weeks, when there's the least room to absorb them.</p>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">05</div><h2>What Can Go Wrong</h2></div>
      <p>Rain on an outdoor event. A power or AV failure mid-programme. A vendor who doesn't show. A last-minute change from a client, a couple, or a keynote speaker. None of these are exotic scenarios — they're the ordinary risks of running anything live, and the plan for them is what a contingency plan actually is: not fear-mongering, just the plan for what you hope never happens.</p>
      <p>What matters is whether that plan exists before the day, not whether it's ever needed. A backup power source on standby, an indoor fallback for outdoor moments, a vendor bench for no-shows, and someone with the authority to make a call in real time — that's the difference between a hiccup nobody in the audience notices and one that becomes the story of the event.</p>
    </div>

    <div class="think-section" style="border-top:none;padding-top:0;margin-top:48px;">
      <div class="think-marker"><div class="mk">06</div><h2>Wedding Thinking, Corporate Thinking</h2></div>
      <p class="muted">The mechanics of event execution are similar across weddings and corporate events. The pressures underneath them are not.</p>
      <div class="think-doors">
        <div class="think-door">
          <div class="eyebrow">Weddings</div>
          <h3>The emotional load is part of the job</h3>
          <p>A wedding carries family expectations, multi-generational opinions, and a couple who — without help — end up as their own event's unpaid project managers, on top of everything else a wedding already asks of them. Good wedding planning absorbs that load rather than adding to it.</p>
          <button type="button" class="btn-secondary" onclick="goTo('case-harsh-krutika-wedding-film')">Explore wedding planning →</button>
        </div>
        <div class="think-door">
          <div class="eyebrow">Corporate</div>
          <h3>Logistics follow the objective, not the other way round</h3>
          <p>A corporate event needs a clear objective before it needs a venue — what leadership is trying to achieve, who inside the company actually owns delivery across departments, and how visibility and ROI get reported afterward. Corporate events done well start with that question, not with the run sheet.</p>
          <button type="button" class="btn-secondary" onclick="goTo('services')">Explore corporate events →</button>
        </div>
      </div>
    </div>

    <div class="think-section">
      <div class="think-marker"><div class="mk">07</div><h2>Concept → Reality</h2></div>
      <p>Every event starts somewhere as an idea — a dream, a mood board, a one-line brief from a client. The work of event execution is translating that into something a team on the ground can actually build, on a specific date, within a specific budget, with a specific set of vendors.</p>
      <p>In practice that translation runs through a fairly consistent sequence: understand what's actually being asked for, challenge the parts of it that won't survive contact with a real venue or a real budget, translate what's left into an execution architecture, build out the specialist ecosystem of vendors that architecture needs, govern the whole thing against one timeline, and arrive at the real event — the version people actually experience.</p>
      <div class="think-flow">
        <span class="step">Understand</span><span class="arrow">→</span>
        <span class="step">Challenge</span><span class="arrow">→</span>
        <span class="step">Translate</span><span class="arrow">→</span>
        <span class="step">Execution architecture</span><span class="arrow">→</span>
        <span class="step">Specialist ecosystem</span><span class="arrow">→</span>
        <span class="step">Govern</span><span class="arrow">→</span>
        <span class="step">Real event</span>
      </div>
      <p class="think-caselink">One place to see that translation happen in practice: <button type="button" class="think-inline-link" onclick="goTo('case-indian-idol-5-roadshow')">the Indian Idol 5 Roadshow case study →</button></p>
    </div>

    <div class="think-close">
      <div class="eyebrow">Still thinking it through?</div>
      <h2>That's the right place to start.</h2>
      <p>None of this requires a decision today. If you've got a date, a budget, half a concept, or just a feeling that this is going to be more complicated than it looks, that's already enough to start a conversation.</p>
      <div class="think-close-ctas">
        <button type="button" class="btn-primary" onclick="goTo('quote')">Tell Us What You're Planning</button>
        <button type="button" class="btn-secondary" onclick="goTo('contact')">Ask Miracle Eventz</button>
        <button type="button" class="btn-secondary" onclick="goTo('contact')">Not Sure Yet? That's Okay</button>
      </div>
    </div>
  </section>`;
}

function submitContact(e){
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('contactSubmitBtn');
  const errBox = document.getElementById('contactFormError');
  if(errBox) errBox.style.display = 'none';
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }

  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  }).then(res => {
    if(res.ok){
      form.outerHTML = `<div class="testi-card" style="background:var(--bg-sunken);"><p style="font-weight:700;">Thanks — your message is in. A planner will reply within one business day.</p></div>`;
      if(typeof gtag === 'function') gtag('event', 'conversion', { send_to: 'G-ZNKNB3BL2D', event_category:'form', event_label:'contact_form' });
    } else {
      throw new Error('Formspree returned ' + res.status);
    }
  }).catch(() => {
    if(errBox) errBox.style.display = 'block';
    if(btn){ btn.disabled = false; btn.textContent = 'Send message'; }
  });
}

/* ============ 7-STEP QUOTE FLOW ============ */
function renderQuote(){
  return `
  <div class="quote-shell page-wrap">
    <form id="quoteForm" action="https://formspree.io/f/mjyvvplb" method="POST">
      <input type="hidden" name="_subject" value="New Quote Request - Miracle Eventz">
      <div id="quoteBody"></div>
      <!-- Hidden fields aggregating the full quote flow, filled in at final submit -->

      <input type="hidden" name="venue" id="qh-venue">
      <input type="hidden" name="addons" id="qh-addons">
      <input type="hidden" name="name" id="qh-name">
      <input type="hidden" name="email" id="qh-email">
      <input type="hidden" name="phone" id="qh-phone">
      <input type="hidden" name="notes" id="qh-notes">
    </form>
  </div>`;
}

function renderStep(){
  const body = document.getElementById('quoteBody');
  if(currentStep > 7){ body.innerHTML = renderSuccess(); return; }
  const meta = STEP_META[currentStep-1];
  const pct = ((currentStep-1)/7)*100;
  body.innerHTML = `
    <div class="progress-label"><span>Step ${currentStep} of 7</span><span>${meta.label}</span></div>
    <div class="progress-track">
      ${STEP_META.map(s=>`<div class="progress-seg"><div class="fill" style="width:${s.n < currentStep ? '100' : s.n===currentStep ? '50' : '0'}%;"></div></div>`).join('')}
    </div>
    <div class="step-card">
      <div class="step-num">${currentStep}</div>
      ${stepContent(currentStep)}
      <div class="step-actions">
        <button type="button" class="btn-secondary" onclick="prevStep()" ${currentStep===1?'style="visibility:hidden;"':''}>← Back</button>
        <button type="button" class="btn-primary" id="nextBtn" onclick="nextStep()">${currentStep===7?'Review & Submit':'Continue →'}</button>
      </div>
    </div>
  `;
  wireStepInputs();
}

function stepContent(n){
  if(n===1){
    const opts = [{v:'wedding',i:'💍',l:'Wedding'},{v:'corporate',i:'🏢',l:'Corporate Event'},{v:'milestone',i:'🎂',l:'Milestone Celebration'},{v:'graduation',i:'🎓',l:'Graduation'},{v:'festival',i:'🎊',l:'Festival / Social'},{v:'engagement',i:'💐',l:'Engagement'}];
    return `<h3>What are we planning?</h3><p class="step-sub">Pick the closest match — we'll tailor the rest of the questions to it.</p>
      <div class="opt-grid">
        ${opts.map(o=>`<button type="button" class="opt-card ${quoteData.eventType===o.v?'selected':''}" data-val="${o.v}" onclick="selectOpt('eventType','${o.v}')"><span class="ico">${o.i}</span><span class="lbl">${o.l}</span></button>`).join('')}
      </div>`;
  }
  if(n===2){
    return `<h3>When's the big day?</h3><p class="step-sub">A rough date is fine — you can confirm the exact date later.</p>
      <div class="field"><label for="q-date">Preferred date</label><input id="q-date" name="date" type="date" value="${quoteData.date}" onchange="quoteData.date=this.value; validateStep();"></div>`;
  }
  if(n===3){
    return `<h3>How many guests?</h3><p class="step-sub">Drag to estimate — exact headcount can wait until closer to the date.</p>
      <div class="range-wrap">
        <div class="range-val" id="guestVal">${quoteData.guests} guests</div>
        <input type="range" name="guests" min="10" max="2000" step="10" value="${quoteData.guests}" oninput="quoteData.guests=this.value; document.getElementById('guestVal').textContent=this.value+' guests';">
      </div>`;
  }
  if(n===4){
    const opts = ['Under ₹1,00,000','₹1,00,000 – ₹3,00,000','₹3,00,000 – ₹7,00,000','₹7,00,000 – ₹15,00,000','₹15,00,000+'];
    return `<h3>What's your budget range?</h3><p class="step-sub">This helps us recommend the right package — nothing is locked in.</p>
      <div class="chip-row">
        ${opts.map(o=>`<button type="button" class="chip ${quoteData.budget===o?'selected':''}" onclick="selectOpt('budget','${o}')">${o}</button>`).join('')}
      </div>`;
  }
  if(n===5){
    const opts = [{v:'have',i:'✅',l:'I already have a venue'},{v:'help',i:'🔍',l:'Help me find one'},{v:'undecided',i:'🤔',l:'Still deciding'}];
    return `<h3>Venue status</h3><p class="step-sub">If you need sourcing help, our venue team will send shortlisted options.</p>
      <div class="opt-grid">
        ${opts.map(o=>`<button type="button" class="opt-card ${quoteData.venue===o.v?'selected':''}" data-val="${o.v}" onclick="selectOpt('venue','${o.v}')"><span class="ico">${o.i}</span><span class="lbl">${o.l}</span></button>`).join('')}
      </div>`;
  }
  if(n===6){
    const opts = ['Catering','Photography & Video','Decor & Florals','Entertainment / DJ','Transportation','Invitations & Stationery'];
    return `<h3>Any add-ons you'd like included?</h3><p class="step-sub">Select all that apply — this is optional.</p>
      <div class="chip-row">
        ${opts.map(o=>`<button type="button" class="chip ${quoteData.addons.includes(o)?'selected':''}" onclick="toggleAddon('${o}')">${o}</button>`).join('')}
      </div>`;
  }
  if(n===7){
    return `<h3>Your details</h3><p class="step-sub">So we know where to send your proposal.</p>
      <div class="field"><label for="q-name">Full name</label><input id="q-name" name="name" required value="${quoteData.name}" oninput="quoteData.name=this.value; validateStep();"><div class="field-error">Please enter your name.</div></div>
      <div class="field"><label for="q-email">Email</label><input id="q-email" name="email" type="email" required value="${quoteData.email}" oninput="quoteData.email=this.value; validateStep();"><div class="field-error">Please enter a valid email.</div></div>
      <div class="field"><label for="q-phone">Phone</label><input id="q-phone" name="phone" required value="${quoteData.phone}" oninput="quoteData.phone=this.value; validateStep();"><div class="field-error">Please enter a phone number.</div></div>
      <div class="field"><label for="q-notes">Anything else we should know? (optional)</label><textarea id="q-notes" name="notes" oninput="quoteData.notes=this.value;">${quoteData.notes}</textarea></div>`;
  }
}

function selectOpt(key, val){
  quoteData[key] = val;
  renderStep();
}
function toggleAddon(name){
  const i = quoteData.addons.indexOf(name);
  if(i>-1) quoteData.addons.splice(i,1); else quoteData.addons.push(name);
  renderStep();
}
function wireStepInputs(){
  validateStep();
}
function validateStep(){
  const btn = document.getElementById('nextBtn');
  if(!btn) return;
  let ok = true;
  if(currentStep===1) ok = !!quoteData.eventType;
  if(currentStep===2) ok = !!quoteData.date;
  if(currentStep===4) ok = !!quoteData.budget;
  if(currentStep===5) ok = !!quoteData.venue;
  if(currentStep===7) ok = quoteData.name.trim().length>0 && /\S+@\S+\.\S+/.test(quoteData.email) && quoteData.phone.trim().length>=7;
  btn.disabled = !ok;
}
function nextStep(){
  if(currentStep===7){
    // validate with visible errors
    let valid = true;
    const nameField = document.getElementById('q-name').closest('.field');
    const emailField = document.getElementById('q-email').closest('.field');
    const phoneField = document.getElementById('q-phone').closest('.field');
    [nameField,emailField,phoneField].forEach(f=>f.classList.remove('has-error'));
    if(quoteData.name.trim().length===0){nameField.classList.add('has-error');valid=false;}
    if(!/\S+@\S+\.\S+/.test(quoteData.email)){emailField.classList.add('has-error');valid=false;}
    if(quoteData.phone.trim().length<7){phoneField.classList.add('has-error');valid=false;}
    if(!valid) return;
    currentStep = 8; // review
    renderReview();
    return;
  }
  currentStep++;
  renderStep();
}
function prevStep(){
  if(currentStep>1){ currentStep--; renderStep(); }
}

function renderReview(){
  const body = document.getElementById('quoteBody');
  const labelFor = {wedding:'Wedding',corporate:'Corporate Event',milestone:'Milestone Celebration',graduation:'Graduation',festival:'Festival / Social',engagement:'Engagement',have:'Already have one',help:'Needs sourcing help',undecided:'Still deciding'};
  body.innerHTML = `
    <div class="progress-label"><span>Almost there</span><span>Review</span></div>
    <div class="progress-track">${STEP_META.map(()=>`<div class="progress-seg"><div class="fill" style="width:100%;"></div></div>`).join('')}</div>
    <div class="step-card">
      <h3>Review your request</h3>
      <p class="step-sub">Everything look right? Submit and a planner will follow up within one business day.</p>
      <div class="review-list">
        <div class="review-row"><span class="k">Event type</span><span class="v">${labelFor[quoteData.eventType]||'—'}</span></div>
        <div class="review-row"><span class="k">Date</span><span class="v">${quoteData.date||'—'}</span></div>
        <div class="review-row"><span class="k">Guests</span><span class="v">${quoteData.guests}</span></div>
        <div class="review-row"><span class="k">Budget</span><span class="v">${quoteData.budget||'—'}</span></div>
        <div class="review-row"><span class="k">Venue</span><span class="v">${labelFor[quoteData.venue]||'—'}</span></div>
        <div class="review-row"><span class="k">Add-ons</span><span class="v">${quoteData.addons.length?quoteData.addons.join(', '):'None'}</span></div>
        <div class="review-row"><span class="k">Contact</span><span class="v">${quoteData.name} · ${quoteData.email}</span></div>
      </div>
      <div class="step-actions">
        <button type="button" class="btn-secondary" onclick="currentStep=7; renderStep();">← Edit</button>
        <button type="button" class="btn-primary" id="quoteSubmitBtn" onclick="submitQuote()">Submit request</button>
      </div>
      <div id="quoteFormError" class="field-error" style="display:none;margin-top:10px;">Something went wrong sending your request — please try again, or reach us directly on the Contact page.</div>
    </div>`;
}

function submitQuote(){
  const btn = document.getElementById('quoteSubmitBtn');
  const errBox = document.getElementById('quoteFormError');
  const form = document.getElementById('quoteForm');
  if(errBox) errBox.style.display = 'none';
  if(btn){ btn.disabled = true; btn.textContent = 'Submitting…'; }

  // aggregate all 7 steps of quoteData into the hidden fields before submitting
  document.getElementById('qh-eventType').value = quoteData.eventType || '';
  document.getElementById('qh-date').value = quoteData.date || '';
  document.getElementById('qh-guests').value = quoteData.guests || '';
  document.getElementById('qh-budget').value = quoteData.budget || '';
  document.getElementById('qh-venue').value = quoteData.venue || '';
  document.getElementById('qh-addons').value = (quoteData.addons || []).join(', ');
  document.getElementById('qh-name').value = quoteData.name || '';
  document.getElementById('qh-email').value = quoteData.email || '';
  document.getElementById('qh-phone').value = quoteData.phone || '';
  document.getElementById('qh-notes').value = quoteData.notes || '';

  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  }).then(res => {
    if(res.ok){
      currentStep = 8;
      document.getElementById('quoteBody').innerHTML = renderSuccess();
      if(typeof gtag === 'function') gtag('event', 'conversion', { send_to: 'G-ZNKNB3BL2D', event_category:'form', event_label:'quote_flow' });
    } else {
      throw new Error('Formspree returned ' + res.status);
    }
  }).catch(() => {
    if(errBox) errBox.style.display = 'block';
    if(btn){ btn.disabled = false; btn.textContent = 'Submit request'; }
  });
}

function renderSuccess(){
  return `<div class="step-card success-card">
    <div class="big-check">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h3>Request sent!</h3>
    <p class="step-sub">Thanks, ${quoteData.name.split(' ')[0]||'there'} — we've got your ${labelForSuccess()} details. A planner will email you at ${quoteData.email} within one business day.</p>
    <button type="button" class="btn-primary" onclick="goTo('home')">Back to home</button>
  </div>`;
}
function labelForSuccess(){
  const m = {wedding:'wedding',corporate:'corporate event',milestone:'milestone celebration',graduation:'graduation',festival:'festival',engagement:'engagement'};
  return m[quoteData.eventType] || 'event';
}

/* ============ V3 SCROLL BEHAVIOR ============ */
let revealObserver = null;
function wireReveals(){
  if(revealObserver) revealObserver.disconnect();
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window) || els.length===0) return;
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); revealObserver.unobserve(en.target); } });
  }, {threshold:0.12});
  els.forEach(el=>revealObserver.observe(el));
}
window.addEventListener('scroll', ()=>{
  const btn = document.getElementById('floatCta');
  if(!btn) return;
  btn.classList.toggle('show', window.scrollY > 480 && route !== 'quote');
}, {passive:true});

/* ============ ANALYTICS: CTA CLICK TRACKING ============ */
// Delegated listener so it catches every "Plan Your Event" CTA (hero pill,
// floating CTA, nav link, and every in-page card button) regardless of
// which render() pass put it on the page.
document.addEventListener('click', function(e){
  const el = e.target.closest('[onclick*="goTo(\'quote\')"]');
  if(el && typeof gtag === 'function'){
    gtag('event', 'cta_click', {
      event_category: 'engagement',
      event_label: 'Plan Your Event',
      cta_text: el.textContent.trim()
    });
  }
});

/* ============ INIT ============ */
route = routeFromHash();
render();
wireReveals();
</script>
